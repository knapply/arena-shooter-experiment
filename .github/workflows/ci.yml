name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install tools
        run: npm install --no-audit --no-fund
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: index.html matches src/
        run: node build.mjs --check
      - name: Headless AI matches
        run: node tests/sim.test.js
      - name: Message registry, save data and map documents
        run: node tests/messages.test.js && node tests/store.test.js && node tests/maps.test.js
      - name: Scenarios (movement, hit registration, mode rules)
        run: node tests/scenarios.test.js
      - name: Performance budgets (size, simulation)
        run: node tests/perf.test.js
      - name: Motion-captured animation (loops, foot skate, cost)
        run: node tests/anim.test.js
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: node tests/browser.test.js
      - name: Game modes and the mode select menu
        run: node tests/modes.test.js
      - name: Network smoothness under simulated lag and loss
        run: node tests/net.test.js
      - name: Render tests and draw budgets (software WebGL)
        run: |
          v=$(node -p "require('./src/manifest.json').three")
          mkdir -p /tmp/three
          for f in three.module.min.js three.core.min.js; do
            curl -sSfL -o /tmp/three/$f "https://cdn.jsdelivr.net/npm/three@$v/build/$f"
          done
          THREE_PATH=/tmp/three/three.module.min.js node tests/render.test.js
      - name: Visual regression (approved screenshots in tests/visual)
        run: THREE_PATH=/tmp/three/three.module.min.js node tests/visual.test.js
