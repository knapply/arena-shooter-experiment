name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tools
        run: npm install --no-audit --no-fund
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: index.html matches src/
        run: node build.mjs --check
      - name: Headless AI matches
        run: node tests/sim.test.js
      - name: Performance budgets (size, simulation)
        run: node tests/perf.test.js
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: node tests/browser.test.js
      - name: Render tests and draw budgets (software WebGL)
        run: |
          curl -sSL -o /tmp/three.min.js https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js
          THREE_PATH=/tmp/three.min.js node tests/render.test.js
