# Sandbox tuning simulations on GitHub's runners: by hand, and weekly so balance drift from code
# changes is caught early. Each matrix job runs tools/tune.js for one knob group and seed set (one
# group is the null controls); the merge job combines them, writes which knobs moved skill share
# beyond the noise as the run's job summary (tools/tune-summary.js), and commits the results and that
# summary to the tune-results branch. It opens no issues and posts no comments.
name: Tune
on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC, with the defaults below
  workflow_dispatch:
    inputs:
      matches:
        description: Matches per variant and kind
        default: "16"
      minutes:
        description: Minutes per match
        default: "4"
      lock:
        description: Weapon lock(s), e.g. carbine,magnum (empty for none)
        default: ""
      map:
        description: ctf (capture the flag) or arena (team deathmatch)
        default: ctf
# only the merge job writes (it commits the results to the tune-results branch)
permissions:
  contents: read
jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        seed: [100, 700]
        group:
          - "sbRun sbSprint sbAccel sbAir"
          - "sbJump sbGrav sbThrust"
          - "sbCarbDmg sbCarbRate sbCarbSpread sbCarbBloom"
          - "sbMagDmg sbMagRate"
          - "sbSnipeDmg sbSnipeRate sbRocketSplash sbRocketRadius"
          - "sbNadeThrow sbNadeBounce sbNadeFuse sbNadeRadius"
          # null controls: run speed nudged by too little to matter, so the run measures its own noise
          - "ctrl"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Simulate
        env:
          # a scheduled run has no inputs: the same defaults as a manual one
          MATCHES: ${{ inputs.matches || '16' }}
          MINUTES: ${{ inputs.minutes || '4' }}
          LOCK: ${{ inputs.lock }}
          MAP: ${{ inputs.map || 'ctf' }}
          SEED: ${{ matrix.seed }}
          OUT: tune.json
        run: |
          if [ "${{ matrix.group }}" = ctrl ]; then
            TRY="sbRun=6.4001,6.3999,6.4002,6.3998" node tools/tune.js sbRun
          else
            node tools/tune.js ${{ matrix.group }}
          fi
      - name: Name the output
        run: |
          key=$(echo "${{ matrix.group }}" | cut -d' ' -f1)-${{ matrix.seed }}
          echo "KEY=$key" >> "$GITHUB_ENV"
          mv tools/out/tune.json "tools/out/tune-$key.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tune-${{ env.KEY }}
          path: tools/out/tune-${{ env.KEY }}.json
  merge:
    needs: sim
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: parts
          merge-multiple: true
      - name: Merge
        run: node tools/tune-merge.js tune-merged.json parts/*.json
      - name: Summary
        run: node tools/tune-summary.js tune-merged.json | tee summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit to tune-results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/res && cp tune-merged.json summary.md parts/*.json /tmp/res/
          git fetch origin tune-results || true
          if git rev-parse --verify -q origin/tune-results; then git checkout tune-results; else git checkout --orphan tune-results && git rm -rqf .; fi
          stamp=$(date -u +%Y%m%d-%H%M)
          mkdir -p "runs/$stamp" && cp /tmp/res/* "runs/$stamp/"
          git add runs && git commit -m "Tuning run $stamp" && git push origin tune-results
